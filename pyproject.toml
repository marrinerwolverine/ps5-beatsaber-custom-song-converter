[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-beatsaber-custom-song-converter"
version = "1.0.0"
description = "Convert BeatSaver community custom songs into native PS5 / PSVR2 Beat Saber format."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ps5-beatsaber-converter = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
